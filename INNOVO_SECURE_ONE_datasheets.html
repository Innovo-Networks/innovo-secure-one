<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Innovo Secure One — Product Datasheets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E2A33; --petrol:#0F4C5C; --petrol2:#15677C; --lime:#8DC63F; --lime-d:#5E8E22;
  --txt:#1B2A30; --mut:#5C7179; --line:#D7E0E2; --band:#F2F6F5; --bandb:#E7EFEC;
  --pos:#3F8F2E; --warn:#C58A1E; --gold:#B8923A;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#5a6b70;font-family:'Inter',system-ui,sans-serif;color:var(--txt);font-size:13px;line-height:1.5}
.toolbar{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;display:flex;align-items:center;gap:16px;padding:11px 24px;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.toolbar .wm{font-weight:800;letter-spacing:.1em;font-size:14px}
.toolbar .wm b{color:var(--lime)}
.toolbar .sp{flex:1}
.toolbar button{background:var(--lime);color:#0B2228;border:none;border-radius:7px;padding:8px 16px;font:inherit;font-weight:700;font-size:12px;cursor:pointer}
.toolbar button.ghost{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff}
.toolbar small{color:#9FB6BC;font-size:11px}
.wrap{max-width:850px;margin:18px auto;padding:0 10px}
.sheet{background:#fff;width:100%;max-width:820px;margin:0 auto 18px;padding:0;border-radius:3px;
  box-shadow:0 6px 26px rgba(0,0,0,.28);overflow:hidden}
.pad{padding:24px 34px 30px}
/* header band */
.hb{background:linear-gradient(115deg,var(--ink) 0%,var(--petrol) 78%);color:#fff;padding:22px 34px 20px;position:relative;overflow:hidden}
.hb:after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:rgba(141,198,63,.16)}
.hb .wm{font-weight:800;letter-spacing:.13em;font-size:12px;opacity:.85}
.hb .wm b{color:var(--lime)}
.hb h1{font-size:27px;font-weight:800;margin:7px 0 4px;line-height:1.05;position:relative;z-index:1}
.hb .tag{font-size:13.5px;color:#CFE9B4;font-weight:500;position:relative;z-index:1}
.hb .cat{position:absolute;right:30px;top:24px;z-index:2;text-align:right}
.chip{display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);
  border-radius:99px;padding:4px 12px;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:#fff}
.chip.lime{background:var(--lime);color:#0B2228;border-color:var(--lime)}
h2.sec{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--petrol);
  margin:20px 0 9px;padding-bottom:5px;border-bottom:2px solid var(--lime);display:inline-block}
.lead{font-size:13.5px;color:var(--txt)}
.lead b{color:var(--ink)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.tcards{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.tcard{background:var(--band);border:1px solid var(--line);border-radius:7px;padding:6px 11px;font-size:11.5px;font-weight:600;color:var(--petrol)}
ul.hl{list-style:none;margin-top:4px}
ul.hl li{padding:5px 0 5px 22px;position:relative;font-size:12.5px}
ul.hl li:before{content:"▸";position:absolute;left:2px;color:var(--lime);font-weight:800}
ul.hl li b{color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
th{background:var(--bandb);color:var(--ink);text-align:left;font-size:10px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;padding:7px 10px;border:1px solid var(--line)}
td{padding:7px 10px;border:1px solid var(--line);vertical-align:top}
td.f{font-weight:700;color:var(--ink);width:38%;background:#FBFDFB}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:0 0;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-top:4px}
.specs div{padding:7px 11px;border-bottom:1px solid var(--line);font-size:11.5px}
.specs div:nth-child(odd){background:#FBFDFB;border-right:1px solid var(--line)}
.specs .k{color:var(--mut);font-weight:600}
.specs .v{color:var(--ink);font-weight:700}
.win{background:linear-gradient(180deg,#F4FAEC,#FBFEF7);border:1px solid #CFE3AE;border-left:5px solid var(--lime);
  border-radius:9px;padding:14px 16px;margin-top:6px}
.win h3{font-size:13px;color:var(--ink);margin-bottom:8px}
.win h3 span{color:var(--lime-d)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:9px}
.vs .b{font-size:11.5px}
.vs .b .lab{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:3px}
.vs .them{color:var(--mut)}
.vs .us{color:var(--ink);font-weight:600}
.edges{list-style:none}
.edges li{padding:3px 0 3px 20px;position:relative;font-size:11.5px;color:var(--ink)}
.edges li:before{content:"✓";position:absolute;left:0;color:var(--lime-d);font-weight:900}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;padding-top:11px;border-top:1px solid var(--line);font-size:10.5px;color:var(--mut)}
.foot b{color:var(--petrol)}
.pricetag{background:var(--ink);color:#fff;border-radius:7px;padding:6px 13px;font-size:11.5px;font-weight:700}
.pricetag span{color:var(--lime)}
/* cover */
.cover .hb{padding:40px 40px 34px}
.cover h1{font-size:38px}
.coverbody{padding:30px 40px 40px}
.toc{columns:2;column-gap:30px;margin-top:6px}
.toc a{display:block;text-decoration:none;color:var(--txt);font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line);break-inside:avoid}
.toc a b{color:var(--petrol)}
.toc a .n{display:inline-block;width:22px;color:var(--lime-d);font-weight:800}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
.stat{background:var(--band);border:1px solid var(--line);border-radius:9px;padding:13px;text-align:center}
.stat .v{font-size:22px;font-weight:900;color:var(--ink)}
.stat .l{font-size:10px;color:var(--mut);font-weight:600;margin-top:2px}
.matrix td.f{width:30%}
.matrix .mk{color:var(--lime-d);font-weight:900}
.matrix .no{color:#B45;font-weight:700}
.matrix .pa{color:var(--warn);font-weight:700}
.note{font-size:10.5px;color:var(--mut);margin-top:10px;font-style:italic}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .toolbar{display:none}
  .wrap{margin:0;max-width:none;padding:0}
  .sheet{box-shadow:none;margin:0;max-width:none;border-radius:0;page-break-after:always}
  .win,table,.specs,.tcards,.foot,.vs{break-inside:avoid}
  .hb:after{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
